<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <title>Détour</title>
  <defs>
    <radialGradient id="halo" cx="512" cy="512" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0.35" stop-color="#F2A33A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2A33A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistLight">
      <stop offset="0" stop-color="#EEF0F2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#EEF0F2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mistVeil">
      <stop offset="0" stop-color="#D5D9DD" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#D5D9DD" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Brouillard : fond gris doux -->
  <rect width="1024" height="1024" fill="#D5D9DD"/>
  <ellipse cx="190" cy="230" rx="330" ry="170" fill="url(#mistLight)"/>
  <ellipse cx="860" cy="170" rx="300" ry="150" fill="url(#mistLight)"/>
  <ellipse cx="840" cy="860" rx="350" ry="170" fill="url(#mistLight)"/>
  <ellipse cx="170" cy="840" rx="310" ry="160" fill="url(#mistLight)"/>

  <!-- Halo de lumière -->
  <circle cx="512" cy="512" r="400" fill="url(#halo)"/>

  <!-- Le cercle découvert -->
  <circle cx="512" cy="512" r="190" fill="#F2A33A"/>

  <!-- Voile de brouillard qui laisse le cercle émerger -->
  <ellipse cx="450" cy="690" rx="290" ry="90" fill="url(#mistVeil)"/>
  <ellipse cx="640" cy="725" rx="220" ry="70" fill="url(#mistVeil)"/>
</svg>
